[project]
name = "mybmo-baidu-ecommerce-marketing"
version = "1.9.0"
description = "WorkBuddy plugin: Baidu e-commerce marketing officer, backed by real keyword data from the Baidu Marketing Open Platform API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # 运行时依赖写在 bmctl.py 的 PEP 723 内联块里；这里只放开发依赖

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.uv]
# 虚拟项目：不打包、不安装。插件运行靠 bmctl.py 里的 sys.path 注入，
# 加 build-system 反而会让「单文件脚本 + 内联元数据」的模型变形。
package = false

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "skills/baidu-marketing-api/references"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bmclient"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["skills/baidu-marketing-api/scripts"]
addopts = "-ra"
